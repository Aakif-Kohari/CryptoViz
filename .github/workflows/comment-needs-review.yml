name: Comment Needs Review

# ==========================================================================
# Keeps the "needs review" label pointed at things that actually need the
# maintainer's attention:
#
#   - A new issue opened by someone other than the maintainer gets the
#     label right away.
#   - A follow-up comment on an issue or PR's conversation tab (from
#     someone other than the maintainer) adds the label so it resurfaces.
#
# Skipped for:
#   - Anything done by the maintainer themselves (an issue they opened, or
#     a comment they left) — see the hardcoded username in the job's `if:`
#     below (used in both branches — see note there for why it can't just
#     read from the env: config block).
#   - Bots (type == "Bot", or a login ending in "[bot]" as a
#     belt-and-suspenders check).
#   - Comments/issues on already-closed issues or merged PRs (nothing to
#     review).
#
# NOTE ON SCOPE: issue_comment fires for comments on the general
# conversation tab of BOTH issues and PRs (GitHub treats a PR as an
# issue under the hood for this event). It does NOT cover inline
# code-review comments (pull_request_review_comment) or a review body
# submitted via "Review changes" (pull_request_review) — say if you
# want those covered too and this can be extended.
#
# The `issues: opened` trigger only fires for actual issues, not PRs
# (PR creation is a separate `pull_request` event) — so opening a PR
# is untouched by this workflow, matching the original scope.
# ==========================================================================

on:
  issue_comment:
    types:
      - created
  issues:
    types:
      - opened

permissions:
  issues: write

jobs:
  label-needs-review:
    name: Label needs-review on contributor issue/comment
    runs-on: ubuntu-latest

    # ------------------------------------------------------------------
    # NOTE: job-level `if:` conditions can't read this job's own `env:`
    # block (env isn't resolved yet at that point in the workflow), so
    # the maintainer username is hardcoded here — in BOTH branches below
    # — rather than pulled from the config block further down. Update
    # all three spots (both branches here, plus MAINTAINER_USERNAME
    # below) if your username ever changes.
    # ------------------------------------------------------------------
    if: |
      (github.event_name == 'issues' &&
        github.event.issue.user.login != 'csxark' &&
        github.event.issue.user.type != 'Bot' &&
        !endsWith(github.event.issue.user.login, '[bot]')) ||
      (github.event_name == 'issue_comment' &&
        github.event.comment.user.login != 'csxark' &&
        github.event.comment.user.type != 'Bot' &&
        !endsWith(github.event.comment.user.login, '[bot]'))

    # ------------------------------------------------------------------
    # CONFIG BLOCK — edit these without touching the script below.
    # ------------------------------------------------------------------
    env:
      MAINTAINER_USERNAME: csxark
      REVIEW_LABEL: "needs review"

    steps:
      - name: Add needs-review label
        uses: actions/github-script@v9
        env:
          REVIEW_LABEL: ${{ env.REVIEW_LABEL }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const reviewLabel = process.env.REVIEW_LABEL;

            // Don't bother labeling something that's already closed/merged.
            if (issue.state !== "open") {
              console.log(`#${issue.number} is not open — skipping.`);
              return;
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issue.number,
              labels: [reviewLabel],
            });

            const actor =
              context.eventName === "issues"
                ? issue.user.login
                : context.payload.comment.user.login;
            const trigger =
              context.eventName === "issues"
                ? "was opened by"
                : "got a follow-up comment from";

            console.log(
              `Added "${reviewLabel}" to #${issue.number} — ${trigger} ${actor}.`
            );