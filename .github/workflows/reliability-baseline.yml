name: Reliability Baseline

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused reliability tests
        run: npx vitest run tests/unit/quality/reliabilityBaseline.test.ts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
